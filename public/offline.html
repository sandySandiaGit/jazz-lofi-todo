<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors ligne</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #3907ed 0%, #18016c 100%);
        color: #18016c;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1rem;
      }

      .container {
        max-width: 500px;
        padding: 2rem;
        background: white;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }

      img {
        width: 120px;
        margin-bottom: 1.5rem;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      h1 {
        margin-bottom: 1rem;
        font-size: 2rem;
        font-weight: bold;
      }

      p {
        margin-bottom: 1rem;
        line-height: 1.6;
      }

      .highlight {
        background: #779bf0;
        padding: 1rem;
        border-radius: 10px;
        margin: 1.5rem 0;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .btn {
        background: #18016c;
        color: white;
        padding: 0.875rem 1.5rem;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      .btn:active {
        transform: translateY(0);
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.5rem;
        }
        .container {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="icon-512.png" alt="Jazz Logo">
      <h1>Vous êtes hors ligne</h1>
      <p>Cette page nécessite une connexion internet pour fonctionner.</p>
      <div class="highlight">
        <strong>Bonne nouvelle !</strong><br>
        Vos données sont sauvegardées et seront synchronisées automatiquement 
        dès le retour du réseau.
      </div>
      <div class="buttons">
        <button class="btn" onclick="window.location.href='/'">
              Se rendre à l'accueil
        </button>
      </div>
    </div>
  </body>
</html>
